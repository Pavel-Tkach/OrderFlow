spring:
  application:
    name: gateway-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/OrderFlow/protocol/openid-connect/certs
      client:
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/OrderFlow
        registration:
          keycloak:
            provider: keycloak
            client-id: gateway-security
            client-secret: hnIghZIpDVsewcowXZ0DmFX3IBcXSIBw
            authorization-grant-type: authorization_code
            scope: openid

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: product-get-route
              uri: lb://product-service
              predicates:
                - Path=/products
                - Method=GET
            - id: product-post-route
              uri: lb://product-service
              predicates:
                - Path=/products
                - Method=POST
              filters:
                - name: AuthFilter
                  args:
                    role: ROLE_USER

jwt:
  public-key: 
